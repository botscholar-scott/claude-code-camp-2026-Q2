tasks:
  player:
    provider: anthropic
    model: claude-haiku-4-5
    #provider: gemini
    #model: gemini-3.5-flash
    #provider: ollama_cloud
    #model: gemma4:31b-cloud
    #provider: ollama
    #model: gemma4
    #provider: openai
    #model: gpt-5.4-mini
    prompt_override:
      system: true
# EVERY tool the agent has comes from this block. boukensha ships none of its
# own — it is an MCP host, and an empty mcp_servers means an agent that can
# only talk. Each entry is one server process: command + args + env, the same
# stdio transport config every MCP host uses.
mcp_servers:
  # The MUD. `mud` is not special to boukensha any more — it's just the server
  # that happens to know telnet and the login dance. Credentials travel by
  # environment because that is what the stdio transport gives you; the LLM
  # never sees them, and the session lives in the daemon.
  #
  # `command`/`args` are resolved by the OS against the shell's cwd — NOT
  # against boukensha_dir/boukensha_path from ~/.boukensharc, and boukensha
  # never chdirs for you. A relative path here only works when you happen to
  # launch from the repo root. Nothing hunts for the binary on your behalf any
  # more — that discovery logic died with Tools::McpMud, which is the trade
  # for the agent not knowing what a MUD is.
  #
  # A bare name, resolved on PATH, so what runs here is a built and installed
  # gem like any other MCP server. Which means: after editing mud_manager,
  #
  #   gem build mud_manager.gemspec && gem install ./mud_manager-<version>.gem
  #
  # and restart, or you are playing the last version you installed. That is the
  # point of it being a gem. Pointing this at a source tree instead makes edits
  # appear for free and quietly hides the fact that nothing was ever packaged.
  #
  # `gem list mud_manager` should show exactly one version. More than one and
  # PATH picks the highest, which is how a run ends up on an old build with no
  # map tools. The banner prints the tool count at boot — currently 31 — so a
  # wrong version is visible immediately.
  #
  # This entry is `required` (the default), so a missing binary fails loudly.
  mud:
    command: mud-manager
    args:    [--mcp]
    prefix:  tbamud          # the daemon's `look` reaches the agent as tbamud__look
    env:
      MUD_HOST:     localhost
      MUD_PORT:     4000
      MUD_NAME:     dummy
      MUD_PASSWORD: helloworld

  # Files. A third-party server nobody wrote boukensha code for — which was the
  # whole point: file access is a server you plug in, not a feature the agent
  # was born with. Uncomment to demonstrate that again; edit the last arg to
  # change what it can reach.
  #
  # Disabled because it was rooted at /tmp, so it could reach neither the MUD
  # nor the repo, and nothing in the system prompt referred to it — while its
  # 14 tool schemas cost ~2,010 tokens on every single API call, 13% of session
  # input, for zero calls made. See F23.
  #
  # required: false so a missing npx is a warning, not a dead agent.
  #filesystem:
  #  command:  npx
  #  args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
  #  prefix:   fs
  #  required: false
